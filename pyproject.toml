[project]
name = "athenai"
version = "0.1.0"
requires-python = ">=3.12"
description = "Modular AI runtime — model routing, RAG, tools, agents, observability"
readme = "README.md"
license = { text = "MIT" }
homepage = "https://github.com/shreyshringare/AthenaAI"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",

    # Config + validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Database
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis
    "redis[hiredis]>=5.0.4",

    # Vector search
    "pgvector>=0.2.5",
    "numpy>=1.26.0",

    # Templating
    "jinja2>=3.1.4",

    # YAML
    "pyyaml>=6.0.1",

    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
]

[project.scripts]
athena = "athenai.gateway.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athenai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]
